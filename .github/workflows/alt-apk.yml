name: Alt APK (test)

# Manual test builds of the Alt flavor from any branch. Tests run here,
# the APK lands as an artifact — the slow R8 link happens on the runner,
# not on a dev machine.
on:
  workflow_dispatch:

jobs:
  build-alt-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Secrets (Alt keystore & local.properties)
        run: |
          echo "${{ secrets.ALT_KEYSTORE_BASE64 }}" | base64 -d > alt-release.jks
          {
            echo "storeFile=alt-release.jks"
            echo "storePassword=${{ secrets.ALT_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ALT_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ALT_KEY_PASSWORD }}"
          } > keystore.properties
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Alt Release APK
        # No watch inside test builds: the Wear bundle needs its own full
        # build per phone build (see BundleWearApk), doubling CI minutes
        # for an APK nobody sideloads onto a watch from here.
        run: ./gradlew :app:assembleAltRelease -Pbitchord.bundleWear=false

      - name: Upload arm64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-alt-release-signed
          path: app/build/outputs/apk/alt/release/app-alt-arm64-v8a-release.apk
